<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1 class="text-primary text-center"> Hello Bootstrap</h1>
    <div class="container big-dark text-white p-3">
        Fixed width container
    </div>
    <div class="container-fluid big-warning p-3"> Full width container </div>
    <div class="container">
        <div class="row">
            <div class="col big-primary text-white p-3">column 1</div>
            <div class="col big-success text-white p-3">column 1</div>
            <div class="col big-danger text-white p-3">column 1</div>
        </div>
        <div class="col-4 big-primary text-white p-3">4 columns </div>
        <div class="col-4 big-warning text-white p-3">8 columns</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
